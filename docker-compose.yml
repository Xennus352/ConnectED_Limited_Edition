name: connect-ed

services:
  mongodb:
    image: mongo:7
    container_name: connect-ed-mongodb
    restart: unless-stopped
    # Prisma transactions require a replica set — single-node is enough here.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - connect_ed_mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  connect_ed_mongodb_data:
